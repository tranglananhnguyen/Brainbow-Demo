<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Brainbow Book Management</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-page">
        <div class="login-container">
            <div class="login-card">
                <div class="login-header">
                    <div class="logo">
                        <svg class="book-icon" viewBox="0 0 24 24" width="24" height="24">
                            <defs>
                                <linearGradient id="bookGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" style="stop-color:#D2B48C;stop-opacity:1" />
                                    <stop offset="100%" style="stop-color:#8B4513;stop-opacity:1" />
                                </linearGradient>
                                <linearGradient id="pageGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                    <stop offset="0%" style="stop-color:#F5F5DC;stop-opacity:1" />
                                    <stop offset="100%" style="stop-color:#F0E68C;stop-opacity:1" />
                                </linearGradient>
                            </defs>
                            <!-- Book cover -->
                            <path d="M4 6 L20 6 L20 18 L4 18 Z" fill="url(#bookGradient)" stroke="#8B4513" stroke-width="0.5"/>
                            <!-- Book spine -->
                            <path d="M4 6 L4 18" stroke="#654321" stroke-width="2"/>
                            <!-- Left page -->
                            <path d="M6 8 L10 8 L10 16 L6 16 Z" fill="url(#pageGradient)" stroke="#D2B48C" stroke-width="0.3"/>
                            <!-- Right page -->
                            <path d="M12 8 L16 8 L16 16 L12 16 Z" fill="url(#pageGradient)" stroke="#D2B48C" stroke-width="0.3"/>
                            <!-- Page lines -->
                            <line x1="6" y1="10" x2="10" y2="10" stroke="#D2B48C" stroke-width="0.2" opacity="0.6"/>
                            <line x1="6" y1="12" x2="10" y2="12" stroke="#D2B48C" stroke-width="0.2" opacity="0.6"/>
                            <line x1="6" y1="14" x2="10" y2="14" stroke="#D2B48C" stroke-width="0.2" opacity="0.6"/>
                            <line x1="12" y1="10" x2="16" y2="10" stroke="#D2B48C" stroke-width="0.2" opacity="0.6"/>
                            <line x1="12" y1="12" x2="16" y2="12" stroke="#D2B48C" stroke-width="0.2" opacity="0.6"/>
                            <line x1="12" y1="14" x2="16" y2="14" stroke="#D2B48C" stroke-width="0.2" opacity="0.6"/>
                        </svg>
                        <span class="brand-text">Brainbow</span>
                    </div>
                    <h2>Welcome Back</h2>
                    <p>Sign in to access your portal</p>
                </div>
                
                <form id="loginForm">
                    <div class="form-group">
                        <label for="role">Select Your Role</label>
                        <select id="role" name="role" required>
                            <option value="">Choose your role...</option>
                            <option value="customer">Customer (Browse, Order, Events)</option>
                            <option value="executive">Executive User (CEO, COO, CFO, CIO)</option>
                            <option value="franchise">Franchise Manager</option>
                            <option value="store">Store Staff</option>
                            <option value="warehouse">Warehouse Employee</option>
                            <option value="author">Author / Event Coordinator</option>
                            <option value="publishing">Publishing Portal</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="you@example.com" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                    </div>
                    
                    <div class="form-group">
                        <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                            <input type="checkbox" name="remember" style="width: auto;">
                            <span>Remember me</span>
                        </label>
                    </div>
                    
                    <button type="submit" class="btn-full">Sign In</button>
                </form>
                
                <div class="login-footer">
                    <p>
                        <a href="#">Forgot password?</a> • 
                        <a href="#">Need help?</a>
                    </p>
                    <p style="margin-top: 1rem;">
                        <a href="index.html">← Back to Home</a>
                    </p>
                </div>
            </div>
            
            <div class="text-center mt-2" style="color: rgba(255,255,255,0.8);">
                <p>Demo Mode: Login redirects to appropriate portal based on role selection</p>
            </div>
        </div>
    </div>
    
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const role = document.getElementById('role').value;
            
            // Route to appropriate portal based on role
            const roleRoutes = {
                'customer': 'customer-portal.html?signedin=true',
                'executive': 'executive-dashboard.html',
                'franchise': 'franchise-portal.html',
                'store': 'store-portal.html',
                'warehouse': 'warehouse-portal.html',
                'author': 'author-portal.html',
                'publishing': 'publishing-portal.html'
            };
            
            if (role && roleRoutes[role]) {
                window.location.href = roleRoutes[role];
            } else {
                alert('Please select a role to continue');
            }
        });
    </script>
</body>
</html>
